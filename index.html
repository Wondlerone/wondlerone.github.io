<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wondle ROI Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-heading: #1F2124;
      --color-subtle: #9197A1;
      --color-disabled: #E1E3E5;
      --color-blue: #008BF8;
      --color-white: #fff;
      --spacing: 0.25rem;
      --radius-sm: 0.25rem;
      --radius-lg: 0.5rem;
    }

    body {
      font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      min-height: 100vh;
      padding: calc(var(--spacing) * 8);
      color: var(--color-heading);
    }

    h1 {
      font-family: 'Khand', sans-serif;
      font-weight: 700;
      font-size: 48px;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: calc(var(--spacing) * 3);
    }

    h2 {
      font-family: 'Khand', sans-serif;
      font-weight: 700;
      font-size: 32px;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: calc(var(--spacing) * 6);
    }

    h3 {
      font-family: 'Satoshi', sans-serif;
      font-size: 18px;
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: calc(var(--spacing) * 4);
    }

    p {
      font-family: 'Satoshi', sans-serif;
      font-size: 18px;
      line-height: 1.6;
      color: var(--color-subtle);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: calc(var(--spacing) * 12);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: calc(var(--spacing) * 8);
    }

    @media (min-width: 1024px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }
      h1 {
        font-size: 72px;
      }
      h2 {
        font-size: 40px;
      }
    }

    .card {
      background: var(--color-white);
      border-radius: var(--radius-lg);
      padding: calc(var(--spacing) * 8);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    .input-group {
      margin-bottom: calc(var(--spacing) * 8);
    }

    .input-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: calc(var(--spacing) * 3);
    }

    .input-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-heading);
    }

    .input-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-blue);
      padding: calc(var(--spacing) * 2) calc(var(--spacing) * 3);
      background: #f8f9fa;
      border-radius: var(--radius-sm);
      min-width: 80px;
      text-align: center;
    }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: var(--color-disabled);
      border-radius: 3px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      background: var(--color-blue);
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      background: var(--color-blue);
      border-radius: 50%;
      cursor: pointer;
      border: none;
      transition: transform 0.2s;
    }

    input[type="range"]::-moz-range-thumb:hover {
      transform: scale(1.2);
    }

    .range-labels {
      display: flex;
      justify-content: space-between;
      margin-top: calc(var(--spacing) * 2);
      font-size: 12px;
      color: var(--color-subtle);
    }

    .divider {
      height: 1px;
      background: var(--color-disabled);
      margin: calc(var(--spacing) * 8) 0;
    }

    .result-card {
      padding: calc(var(--spacing) * 6);
      border-radius: var(--radius-lg);
      margin-bottom: calc(var(--spacing) * 4);
      border: 2px solid;
    }

    .result-card.blue {
      background: #f0f9ff;
      border-color: #bfdbfe;
    }

    .result-card.amber {
      background: #fffbeb;
      border-color: #fde68a;
    }

    .result-card.rose {
      background: #fff1f2;
      border-color: #fecdd3;
    }

    .result-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-subtle);
      margin-bottom: calc(var(--spacing) * 2);
    }

    .result-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--color-heading);
    }

    .total-card {
      background: linear-gradient(135deg, var(--color-heading) 0%, #2d3135 100%);
      color: var(--color-white);
      padding: calc(var(--spacing) * 8);
      border-radius: var(--radius-lg);
      text-align: center;
      box-shadow: 0 10px 30px rgba(31, 33, 36, 0.2);
    }

    .total-label {
      font-size: 18px;
      font-weight: 500;
      margin-bottom: calc(var(--spacing) * 2);
      opacity: 0.9;
    }

    .total-value {
      font-size: 56px;
      font-weight: 700;
      margin-bottom: calc(var(--spacing) * 4);
    }

    .total-description {
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    function formatCurrency(value) {
      return new Intl.NumberFormat('en-GB', {
        style: 'currency',
        currency: 'GBP',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0,
      }).format(value);
    }

    function SliderInput({ label, value, onChange, min, max, step, suffix = '' }) {
      return (
        <div className="input-group">
          <div className="input-header">
            <label className="input-label">{label}</label>
            <div className="input-value">
              {typeof value === 'number' ? value.toLocaleString() : value}{suffix}
            </div>
          </div>
          <input
            type="range"
            min={min}
            max={max}
            step={step}
            value={value}
            onChange={(e) => onChange(Number(e.target.value))}
          />
          <div className="range-labels">
            <span>{min.toLocaleString()}</span>
            <span>{max.toLocaleString()}</span>
          </div>
        </div>
      );
    }

    function ResultCard({ label, value, color }) {
      return (
        <div className={`result-card ${color}`}>
          <p className="result-label">{label}</p>
          <p className="result-value">{formatCurrency(value)}</p>
        </div>
      );
    }

    function DamageCalculator() {
      const [vehiclesReturned, setVehiclesReturned] = useState(20000);
      const [damageComplaintRate, setDamageComplaintRate] = useState(15);
      const [handlingCost, setHandlingCost] = useState(150);
      const [goodwillPayment, setGoodwillPayment] = useState(175);
      const [complaintsAvoided, setComplaintsAvoided] = useState(30);
      const [unreportedDamageRate, setUnreportedDamageRate] = useState(4);
      const [repairDelayDays, setRepairDelayDays] = useState(30);
      const [holdingCostPerDay, setHoldingCostPerDay] = useState(25);
      const [damageReduction, setDamageReduction] = useState(30);

      const totalComplaints = vehiclesReturned * (damageComplaintRate / 100);
      const complaintsReduced = totalComplaints * (complaintsAvoided / 100);
      const savingsFromComplaints = complaintsReduced * handlingCost;
      const savingsFromGoodwill = complaintsReduced * goodwillPayment;

      const unreportedDamageCases = vehiclesReturned * (unreportedDamageRate / 100);
      const damageReductionCases = unreportedDamageCases * (damageReduction / 100);
      const savingsFromRemarketing = damageReductionCases * repairDelayDays * holdingCostPerDay;

      const totalSavings = savingsFromComplaints + savingsFromGoodwill + savingsFromRemarketing;

      return (
        <div className="container">
          <div className="header">
            <h1>Wondle ROI Calculator</h1>
            <p>Calculate ballpark savings for your leasing company.</p>
          </div>

          <div className="grid">
            <div>
              <div className="card">
                <h2>Input Parameters</h2>

                <SliderInput
                  label="Vehicles Returned Per Year"
                  value={vehiclesReturned}
                  onChange={setVehiclesReturned}
                  min={0}
                  max={50000}
                  step={500}
                />

                <SliderInput
                  label="Damage Complaint Rate (%)"
                  value={damageComplaintRate}
                  onChange={setDamageComplaintRate}
                  min={0}
                  max={50}
                  step={0.5}
                  suffix="%"
                />

                <SliderInput
                  label="Handling Cost Per Damage Complaint (£)"
                  value={handlingCost}
                  onChange={setHandlingCost}
                  min={0}
                  max={500}
                  step={10}
                />

                <SliderInput
                  label="Average Damage Goodwill Payment (£)"
                  value={goodwillPayment}
                  onChange={setGoodwillPayment}
                  min={0}
                  max={1000}
                  step={25}
                />

                <SliderInput
                  label="Damage Complaints Avoided (%) - You can expect 30% reduction with Wondle"
                  value={complaintsAvoided}
                  onChange={setComplaintsAvoided}
                  min={10}
                  max={50}
                  step={1}
                  suffix="%"
                />

                <div className="divider"></div>

                <SliderInput
                  label="Unreported Accident Damage Rate (%)"
                  value={unreportedDamageRate}
                  onChange={setUnreportedDamageRate}
                  min={0}
                  max={20}
                  step={0.5}
                  suffix="%"
                />

                <SliderInput
                  label="Average Days Delay for Repair"
                  value={repairDelayDays}
                  onChange={setRepairDelayDays}
                  min={0}
                  max={60}
                  step={1}
                />

                <SliderInput
                  label="Holding Cost Per Day (£)"
                  value={holdingCostPerDay}
                  onChange={setHoldingCostPerDay}
                  min={0}
                  max={100}
                  step={5}
                />

                <SliderInput
                  label="Reduced Unreported Accident Damage (%)"
                  value={damageReduction}
                  onChange={setDamageReduction}
                  min={10}
                  max={50}
                  step={1}
                  suffix="%"
                />
              </div>
            </div>

            <div>
              <div className="card">
                <h2>Results</h2>

                <ResultCard
                  label="Savings from Complaints"
                  value={savingsFromComplaints}
                  color="blue"
                />

                <ResultCard
                  label="Savings from Goodwill"
                  value={savingsFromGoodwill}
                  color="amber"
                />

                <ResultCard
                  label="Savings from Delayed Remarketing"
                  value={savingsFromRemarketing}
                  color="rose"
                />
              </div>

              <div className="total-card">
                <p className="total-label">Total Annual Savings</p>
                <p className="total-value">{formatCurrency(totalSavings)}</p>
                <p className="total-description">
                  With {complaintsAvoided}% complaints avoided and {damageReduction}% damage reduction
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<DamageCalculator />, document.getElementById('root'));
  </script>
</body>
</html>
